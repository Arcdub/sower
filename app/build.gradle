plugins {
    alias libs.plugins.android.application
}

// Release signing: one key for every distribution channel (direct APK, F-Droid, Play),
// so any copy can update any other. Keep sower-release.jks and keystore.properties
// backed up and out of version control, since losing the key orphans every installed copy.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'arcsky.steph.sower'
    compileSdk 37

    defaultConfig {
        applicationId "arcsky.steph.sower"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    // One small APK per Bible language, installable side by side, so the app always
    // stays a quick Bluetooth/Quick Share transfer. Each flavor bundles one translation
    // in src/<flavor>/assets/bible (generate with tools/transform.js).
    flavorDimensions = ["language"]
    productFlavors {
        en {
            dimension "language"
            resValue "string", "app_name", "Sower"
            resValue "string", "about_translation", "World English Bible and Berean Standard Bible: public domain, freely shareable."
        }
        es {
            dimension "language"
